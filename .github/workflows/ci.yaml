# The checks CONTRIBUTING.md asks for, enforced instead of trusted.
#
# The lint and e2e jobs delegate to the same make targets a contributor runs
# locally (`make lint`, `make test`), so the local and CI invocations cannot
# drift — the logic lives in scripts/lint.sh and enterprise/test/run.sh. Two
# more jobs (comfyui-smoke, image-uid) cover things a laptop `make` run does
# not: the real pinned ComfyUI booting, and arbitrary-UID compatibility.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same PR (or branch) supersedes the in-flight run instead
# of queueing behind it — these jobs build Docker images and are not free,
# and only the latest commit's result matters for a PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN scope on pull_request is otherwise whatever the org
# default is (can be write); none of these jobs need more than reading the
# repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --quiet pyyaml

      - name: install kubeconform
        run: |
          # Pinned release binary rather than `go install`, so this job does
          # not need a Go toolchain just to check manifest shapes. Checksum
          # is the one published in the release's own CHECKSUMS file.
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz kubeconform

      - name: validate manifests against Kubernetes/OpenShift/KEDA schemas
        run: |
          # -ignore-missing-schemas: route.openshift.io/v1 Route and the core
          # NetworkPolicy kind have no entry in kubeconform's default schema
          # catalog, and this repo has no vendored OpenShift CRD schema to
          # point at instead. KEDA's ScaledObject/TriggerAuthentication DO
          # have a maintained schema catalog (datreeio/CRDs-catalog), so that
          # is added as a second -schema-location rather than also ignored.
          #
          # enterprise/manifests/05-oauth-proxy-patch.yaml is a
          # strategic-merge patch fragment (no kind/apiVersion of its own,
          # applied by scripts/05-deploy.sh) rather than a standalone
          # manifest; kubeconform has no notion of "not a full resource", so
          # it is excluded by name instead of reported as a false failure.
          kubeconform -strict -ignore-missing-schemas -summary \
            -ignore-filename-pattern '.*05-oauth-proxy-patch\.yaml' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            manifests/base enterprise/manifests

      - name: kustomize build manifests/base
        run: |
          # `kubectl kustomize` rather than a standalone kustomize: kubectl is
          # on every ubuntu runner image, the kustomize binary is not on
          # ubuntu-24.04, and scripts/05-deploy.sh applies this same overlay
          # with `oc apply -k`, i.e. the kubectl-embedded kustomize — so this
          # also builds it with the implementation that ships. enterprise/
          # manifests has no kustomization.yaml — those are applied directly,
          # not through an overlay — so only manifests/base has a build to
          # validate; the rendered output is fed back through kubeconform so
          # a kustomize-only mistake (e.g. a patch producing something the
          # raw files don't show) is still schema-checked.
          kubectl kustomize manifests/base | kubeconform -strict -ignore-missing-schemas -summary

      - name: make lint
        run: make lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install redis and python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          # Both requirements files, not gateway's plus a hand-typed
          # websocket-client: the worker's requirements.txt already declares
          # websocket-client (what the checks use to talk to the gateway),
          # and its own redis<7 pin, kept here as one file to edit instead of
          # two places that can drift. enterprise/test/unit's own
          # requirements-test.txt adds pytest, pinned separately because it
          # is a test-only dependency neither shipped image needs.
          # pyyaml: scripts/unit-tests.sh runs the real lint.sh against its
          # manifest fixtures, and lint.sh skips every manifest rule without
          # it — which would fail those fixtures for a reason unrelated to
          # the change.
          python3 -m pip install --quiet pyyaml \
            -r enterprise/gateway/requirements.txt \
            -r enterprise/worker/requirements.txt \
            -r enterprise/test/unit/requirements-test.txt

      # Fast, in-process, no Redis needed -- runs first so a broken pure
      # function fails in seconds instead of after the e2e suite's ~minute.
      # `make test` below runs this same layer again as its first step; kept
      # as its own step too so a failure here is its own red check instead
      # of scrolling past inside the e2e job's combined log.
      - name: unit tests (pytest)
        run: python3 -m pytest enterprise/test/unit -q

      - name: make test
        run: make test

  # The real ComfyUI — the pinned tag, CPU-only — booted with the images' own
  # path flags, asserting that models in <models-dir>/checkpoints are visible
  # and custom nodes in the install tree load. This is the mechanical
  # regression test for the --models-directory contract: under the old
  # --base-directory flag this job fails at boot (ComfyUI crashes scanning
  # <base>/custom_nodes) and the assertions fail besides.
  comfyui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: boot ComfyUI on CPU and assert the path contract
        run: |
          # The images mount volumes at /models and /output; use the same
          # absolute paths so the test exercises exactly what ships.
          sudo mkdir -p /models /output
          sudo chown -R "$USER" /models /output
          MODELS_DIR=/models OUTPUT_DIR=/output scripts/ci-smoke-comfyui.sh

  # Build the gateway image and run it the way OpenShift's restricted-v2 SCC
  # will: as an arbitrary high UID with GID 0 supplementary, ignoring the
  # image's USER. This is the single most common way an image that works
  # under `docker run` breaks on OpenShift — tested here without a cluster.
  # (The two GPU images are too large to build on every PR; nightly.yaml
  # builds and UID-tests both of them once a day instead — gpu-single-user-
  # image and gpu-worker-image.)
  image-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build the gateway image
        run: docker build -t gateway-uid-test -f enterprise/gateway/Containerfile enterprise/gateway

      - name: serve as an arbitrary UID
        run: |
          docker run -d --name gw --user 1000670000:0 -p 8000:8000 gateway-uid-test

          ok=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              ok=1
              break
            fi
            sleep 2
          done
          echo

          if [ -z "$ok" ]; then
            docker logs gw
            echo "gateway did not serve /healthz as an arbitrary UID with GID 0"
            exit 1
          fi

      # Moved to run after the arbitrary-UID proof above (used to sit between
      # build and serve, with exit-code: 1): a newly-disclosed HIGH/CRITICAL
      # in the ubi9 base image used to fail this job before the correctness
      # test this job exists for — the arbitrary-UID boot — ever ran, on
      # every unrelated PR. continue-on-error keeps a CVE from blocking the
      # PR check entirely; the scan still runs and still shows red in the job
      # summary, it just doesn't gate. This is intentionally soft only for
      # this small, frequently-rebuilt image — the two GPU images
      # (nightly.yaml) scan with exit-code 1 and no continue-on-error,
      # because they build once a day, not on every push.
      - name: scan the gateway image for known CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        env:
          # Anonymous ghcr.io pulls of the trivy vulnerability DB are
          # IP-rate-limited on shared GitHub runners; fall back to the
          # AWS-hosted mirror first.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: gateway-uid-test
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          cache: true

# The pins in this repo are deliberate (several are load-bearing — see the
# redis<7 note in enterprise/gateway/requirements.txt), so the point of
# dependabot here is not auto-merge: it is being TOLD when a new major exists
# instead of discovering it years later. CI's e2e suite is the judge — a bump
# PR whose checks pass has already proven itself against the blocking-read
# paths that made the pins load-bearing in the first place.
#
# Each directory's updates are grouped into a single weekly PR rather than
# one PR per dependency — three separate fastapi/uvicorn/redis bump PRs (say)
# tell you nothing three lines in one PR description don't, and each one
# alone re-runs the whole e2e suite for the same verification.
version: 2
updates:
  - package-ecosystem: pip
    directory: /enterprise/gateway
    schedule:
      interval: weekly
    groups:
      gateway-pip:
        patterns:
          - "*"
    # redis majors are excluded, not merely expected to fail: the <7 ceiling
    # is load-bearing (the requirements comment), and a PER-DIRECTORY redis
    # major can never go green anyway — CI and every local flow install the
    # gateway's and the worker's requirements into ONE environment, so a bump
    # on either side alone is pip ResolutionImpossible against the other
    # (how #10 and #11 actually failed). Lifting the ceiling is one
    # deliberate cross-directory change after re-testing the blocking paths,
    # made by a person, not proposed weekly by a bot.
    ignore:
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /enterprise/worker
    schedule:
      interval: weekly
    groups:
      worker-pip:
        patterns:
          - "*"
    # Same reasoning as the gateway group's ignore above.
    ignore:
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

---
# Fixture: a worker Deployment wired back to the ADMIN Redis credential,
# comfy-redis/password, instead of the least-privilege ACL user's
# worker_password.
#
# This is the shape the worker shipped with until W4, and it is the shape a
# well-meaning edit restores: `worker_password` looks like a typo for
# `password` to anyone who has not read the redis args, and the pod comes up
# and works perfectly either way. What changes is that arbitrary custom-node
# Python on a GPU node can read a credential that can FLUSHALL the queue,
# rewrite another submitter's job state, or CONFIG SET the memory ceiling.
#
# Otherwise shaped like enterprise/manifests/02-worker.yaml — correctly sized,
# correctly tolerated, no ServiceAccount token, carrying the app: comfy-worker
# label the NetworkPolicy selects, and naming the right USER in REDIS_URL (the
# other half of this invariant, isolated in its own fixture) — so the Secret
# key is this file's only violation.
#
# Valid YAML, so yaml.safe_load_all accepts it happily.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfy-worker
  labels:
    app: comfy-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: comfy-worker
  template:
    metadata:
      labels:
        app: comfy-worker
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        GPU_NODE_LABEL_KEY: "GPU_NODE_LABEL_VALUE"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: comfy-worker:latest
          env:
            # Correct on purpose — the Secret key below is the violation.
            - name: REDIS_URL
              value: redis://comfy-worker@redis:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: password
          resources:
            # Correctly sized on purpose: requests equal limits, both within
            # what the smallest supported GPU instance can give one pod.
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi

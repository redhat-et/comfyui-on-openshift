---
# The gateway. Runs on the cheap base worker nodes, never on a GPU node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfy-gateway
  labels:
    app: comfy-gateway
spec:
  # Two replicas is safe and worth it. Redis Streams are the source of truth for
  # progress, so any replica can serve any job's WebSocket — no sticky sessions,
  # no shared in-memory state, and a rollout does not drop every connection at
  # once. Clients reconnect and replay from the start of the stream.
  #
  # This number is load-bearing for hub.py's reaper, in the direction that is
  # easy to miss: TWO reapers run, and they race. RPOP being atomic is what
  # makes them safe to fail a job at most once, and it is NOT what makes them
  # safe to REQUEUE one at most once (docs/10-roadmap.md, Q2) — that comes from
  # the atomic HINCRBY on the attempt counter. enterprise/test/run.sh starts one
  # gateway and so cannot exhibit the race; scripts/lint.sh pins the shape, and
  # cluster day is where two replicas racing over one dying worker gets watched
  # for real.
  replicas: 2

  selector:
    matchLabels:
      app: comfy-gateway

  template:
    metadata:
      labels:
        app: comfy-gateway
    spec:
      # Keep this off the GPU nodes. It has no toleration for the
      # nvidia.com/gpu taint, so this is belt and braces, but an untainted GPU
      # node in someone's future cluster would otherwise be a valid target for
      # a pod that has no business there.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: DoesNotExist

        # Two replicas on one node are one replica with extra steps. The whole
        # argument for replicas: 2 above is that a node going away — a drain,
        # an upgrade, a spot reclaim — does not drop every open WebSocket at
        # once, and the scheduler will happily co-locate them if nothing says
        # otherwise.
        #
        # PREFERRED, not required. On a cluster with a single base node —
        # BASE_REPLICAS is 2 in .env.example but a single-node OpenShift is a
        # supported target here — a required rule leaves the second replica
        # Pending forever, which trades an availability nicety for half a
        # gateway. Preferred spreads them when there is somewhere to spread to
        # and schedules anyway when there is not.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: comfy-gateway

      # No Kubernetes API client lives in this pod, so the projected
      # ServiceAccount token is nothing but a credential sitting in the
      # filesystem waiting to be read. Verified against the source rather than
      # assumed: neither enterprise/gateway/hub.py nor
      # enterprise/worker/worker_agent.py imports a Kubernetes client or opens
      # the API server at all — Redis is the only thing either one dials.
      #
      # AUTH_MODE=oauth turns this back on: 05-oauth-proxy-patch.yaml adds the
      # proxy sidecar, and THAT does call the API server — TokenReview for the
      # login and a SubjectAccessReview for --openshift-sar. The patch sets it
      # to true again, in the same file that introduces the container needing
      # it, so the two can never be separated by an edit.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: gateway
          image: comfy-gateway:latest

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: password
            - name: OUTPUT_ROOT
              value: /output
            - name: MODELS_ROOT
              value: /models
            - name: QUEUE_KEY
              value: comfy:queue

            # Q5's per-user GPU-second quota (docs/10-roadmap.md). The
            # placeholder is substituted from .env by enterprise/setup.sh —
            # the same shape 03-autoscale.yaml's maxReplicaCount uses — so
            # the number lives with the rest of the configuration and not
            # here. Applied by hand, this file leaves the value unsubstituted
            # and hub.py reads anything it cannot parse as a number as OFF,
            # which is also the default: see BEGIN QUOTA BREAKER in hub.py.
            - name: QUOTA_GPU_SECONDS
              value: "QUOTA_GPU_SECONDS_PLACEHOLDER"
            # N4's all-in $/GPU-hour for the FOCUS chargeback export, same
            # substitution shape. Unsubstituted or garbled, hub.py falls
            # back to its own default (docs/02's g6.xlarge rate) with a log
            # line rather than refusing to start.
            - name: GPU_HOURLY_RATE
              value: "GPU_HOURLY_RATE_PLACEHOLDER"
            # hub.py scopes /outputs and /api/showback to the caller only when
            # it knows a proxy is in front of it; under "none" the identity
            # header is client-supplied and scoping would be theatre.
            - name: AUTH_MODE
              value: "AUTH_MODE_PLACEHOLDER"
            # Comma-separated identities that may read every submitter's row
            # of /api/showback under AUTH_MODE=oauth. Empty: nobody but the
            # caller's own row plus totals.
            - name: SHOWBACK_OPERATORS
              value: "SHOWBACK_OPERATORS_PLACEHOLDER"
            # N2's VRAM tiers, smallest card first (docs/10-roadmap.md) —
            # substituted from .env's GPU_TIERS by enterprise/setup.sh, BY KEY
            # (a sed on the name line's value) rather than through a
            # *_PLACEHOLDER literal, deliberately: hub.py REFUSES an invalid
            # tier list at import — a misrouted tier is a queue nothing
            # drains — so an unsubstituted placeholder here would crash-loop
            # a hand-applied gateway, where the empty string is simply
            # tiering off, the safe pre-N2 pool.
            - name: GPU_TIERS
              value: ""

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The gateway writes nothing to its own filesystem. It reads
            # static/index.html, serves /output from a read-only mount, and
            # keeps everything else in Redis; PYTHONDONTWRITEBYTECODE=1 in the
            # image means not even a .pyc. So the image layer can be immutable,
            # and a bug or a dependency that lets someone drop a file into the
            # application directory has nowhere to put it.
            #
            # /tmp is an emptyDir below rather than left unwritable: it costs
            # nothing, and "read-only root filesystem" failures in a Python
            # process are usually a library reaching for a temp file, reported
            # as a traceback nobody connects to this line.
            #
            # Not applied to the oauth-proxy sidecar in
            # 05-oauth-proxy-patch.yaml — that is a different vendor's binary
            # and a separate thing to prove.
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            # Read-only: the gateway serves finished images, it never writes.
            # This is the whole reason the enterprise configuration needs
            # ReadWriteMany storage — this pod and the worker pods are on
            # different nodes and need the same filesystem.
            - name: output
              mountPath: /output
              readOnly: true

            # Writable, unlike /output, and that asymmetry is the design:
            # the workers have no internet (06-network-policy.yaml), so the
            # one-button model install lives HERE — hub.py's BEGIN MODEL
            # INSTALLS validates the source and the format and streams onto
            # this volume, once, for every worker to see. This is the "job
            # that validates the source and the format" the network policy's
            # comment promises instead of a worker egress hole.
            - name: models
              mountPath: /models

          # Liveness does not touch Redis on purpose. If Redis blips, readiness
          # should drop (stop sending traffic) but the pods should not all be
          # restarted on top of it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10

      volumes:
        - name: tmp
          emptyDir: {}
        - name: output
          persistentVolumeClaim:
            claimName: comfyui-output
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
---
apiVersion: v1
kind: Service
metadata:
  name: comfy-gateway
  labels:
    app: comfy-gateway
spec:
  selector:
    app: comfy-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Keep at least one gateway serving during voluntary disruptions (node drains,
# cluster upgrades). Without this, a drain can take both replicas at once and
# every open WebSocket dies together — which the anti-affinity above makes less
# likely and does not prevent, since a cluster upgrade drains every node
# eventually.
#
# It lives here rather than in 03-autoscale.yaml, where it used to, because
# 03 is applied only when SCALE_TO_ZERO=true. A gateway pair does not become
# less worth protecting because the GPU pool is pinned at one worker, and the
# budget quietly not existing in that configuration was the kind of gap nobody
# notices until the upgrade.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: comfy-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: comfy-gateway

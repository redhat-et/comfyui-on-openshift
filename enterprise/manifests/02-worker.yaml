---
# GPU workers. No Service, no Route, no ingress — on purpose.
#
# ComfyUI inside these pods binds 127.0.0.1. The agent process in the same
# container is the only thing that can reach it, and the agent's only interface
# is Redis. That is what makes the pool safe to scale between 0 and N: there is
# no connection state, no load balancer affinity, and nothing for a user to
# point a browser at.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfy-worker
  labels:
    app: comfy-worker
spec:
  # This number is not authoritative — the ScaledObject in 03-autoscale.yaml
  # owns it from the moment KEDA reconciles. It is 0 here so that applying the
  # manifests before the autoscaler exists does not start an $0.80/hour node.
  replicas: 0

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: comfy-worker

  template:
    metadata:
      labels:
        app: comfy-worker
    spec:
      # This label MUST be one the machine pool declares, not one Node Feature
      # Discovery applies at runtime — and that distinction silently breaks
      # scale-from-zero if you get it wrong.
      #
      # When the GPU pool is at zero nodes, the cluster autoscaler has no real
      # node to inspect. It builds a template from the pool's declared labels
      # and asks "would the pending pod fit?". NFD labels like
      # feature.node.kubernetes.io/pci-10de.present only exist once a node is
      # already running, so they are absent from that template, the autoscaler
      # concludes the pod would not fit, and it never provisions anything. The
      # pod stays Pending forever with no error that points at the cause.
      #
      # nvidia.com/gpu.present comes from `rosa create machinepool --labels` in
      # scripts/02-cluster.sh, so it IS in the template. setup.sh substitutes
      # GPU_NODE_LABEL here if your cluster labels its GPU nodes differently.
      nodeSelector:
        GPU_NODE_LABEL_KEY: "GPU_NODE_LABEL_VALUE"

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # A generation in flight is real money already spent. The agent traps
      # SIGTERM, stops taking new work, and finishes the current job; this is
      # the window it gets to do that. Anything much shorter and scale-down
      # throws away work.
      #
      # Must exceed JOB_TIMEOUT below, plus margin: a job may legally run for
      # the full JOB_TIMEOUT, and a drain that is SIGKILLed at second 900 of a
      # 1500-second render threw the work away anyway. Change them together.
      terminationGracePeriodSeconds: 1980

      # No Kubernetes API client lives in this pod, so the projected
      # ServiceAccount token is nothing but a credential sitting in the
      # filesystem waiting to be read. Verified against the source rather than
      # assumed: neither enterprise/gateway/hub.py nor
      # enterprise/worker/worker_agent.py imports a Kubernetes client or opens
      # the API server at all — Redis is the only thing either one dials.
      #
      # It matters more here than anywhere else in the namespace: this pod runs
      # arbitrary custom-node Python on a GPU node, and a mounted token is a
      # credential that node's code can read and use against the cluster.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: comfy-worker:latest

          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: password
            - name: QUEUE_KEY
              value: comfy:queue
            - name: JOB_TIMEOUT
              value: "1800"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: TORCH_HOME
              value: /models/.cache/torch

          # Requests equal limits on every resource, which is not a style
          # choice — it is the QoS class. Read the numbers first, then why
          # they are equal.
          #
          # THE NUMBERS. All host RAM; none of it is the 24 GB of VRAM on the
          # card, and conflating the two is how this block previously asked
          # for a 24Gi limit. The smallest GPU instance type this repo
          # supports — g6.xlarge (the .env.example default), g5.xlarge,
          # g4dn.xlarge, all of them in scripts/06-status.sh's price table —
          # is 4 vCPU and 16 GiB. Of that 16 GiB the scheduler offers roughly
          # 12.4 GiB: OpenShift's automatic node sizing reserves about 2.8 GiB
          # on a 16 GiB machine, plus a 100 MiB eviction threshold. A GPU node
          # then runs more DaemonSets than a plain one — ovn-kubernetes,
          # machine-config, node-exporter, the GPU operator's driver,
          # container toolkit, device plugin and DCGM exporter, and NFD —
          # holding on the order of 1.5-2 GiB and several hundred millicores.
          # That leaves ~10.5 GiB and ~3 cores for this pod, so 10Gi and 2
          # cores is the largest round figure that provably fits.
          #
          # It is also enough for the documented workload: a single SDXL-class
          # checkpoint is ~7 GB (docs/03-storage.md) and is staged in host RAM
          # on its way to VRAM, torch plus the CUDA host runtime and its pinned
          # staging buffers are another 1.5-2 GiB, and the agent is noise —
          # roughly 9 GiB at peak, with about a gigabyte spare. What 10Gi does
          # NOT cover is a workflow holding two large checkpoints in host RAM
          # at once (ComfyUI offloads to CPU RAM under VRAM pressure). The
          # answer to that is a larger instance type — g6.2xlarge or
          # g6e.xlarge, 32 GiB — because a limit above what the node can give
          # is not more memory, it is just a number that never binds.
          #
          # WHY EQUAL. Equal requests and limits on cpu AND memory is what
          # makes this pod Guaranteed QoS, and both halves of that matter to a
          # pod holding an $0.80/hour card mid-generation:
          #   - The kubelet evicts pods that are over their request before it
          #     touches a Guaranteed pod. The old 8Gi request with a 24Gi limit
          #     was Burstable and went over its request on the first checkpoint
          #     load, i.e. during every job.
          #   - oom_score_adj follows the same class. Burstable gets
          #     1000 - 1000 x request/capacity (~500 at 8Gi of 16 GiB);
          #     Guaranteed gets -997. That is the difference between the kernel
          #     picking ComfyUI and the kernel picking almost anything else.
          # The cost is no bursting. On a node with one GPU, and therefore one
          # GPU pod, the burst headroom was only ever borrowed from the kubelet
          # and those DaemonSets — the processes whose starvation is exactly
          # what turns a container problem into a node-level one.
          #
          # A reachable limit is also the point: at 10Gi the container hits its
          # own cgroup ceiling and dies as a clean OOMKilled you can read off
          # `oc describe`, instead of the node deciding for it. scripts/lint.sh
          # holds these numbers; it fails a GPU pod that is Burstable or that
          # asks for more than the smallest supported instance can give.
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi
            limits:
              # GPUs are indivisible: request and limit must be equal — as
              # they now are for cpu and memory too, for the reasons above.
              # This block is also what makes the pod Pending until a GPU node
              # exists, which is in turn what makes the cluster autoscaler
              # provision one. That still holds, and it is why the requests
              # must stay inside one node's allocatable: a request no node can
              # satisfy leaves the pod Pending forever with a node already
              # running, which looks identical and is not fixable by adding
              # nodes.
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Flush anything still buffered for the shared filesystem before the
          # container goes away. Cheap insurance: a pod that exits with dirty
          # NFS pages can leave the kubelet retrying the unmount, which is one
          # of the ways a volume ends up looking stuck. Runs before SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sync; sleep 2"]

          volumeMounts:
            - name: models
              mountPath: /models
            - name: output
              mountPath: /output
            - name: scratch
              mountPath: /tmp

          # No HTTP probes: ComfyUI listens on loopback, so the kubelet cannot
          # reach it. An exec probe runs inside the container's network
          # namespace and can. The startup budget is deliberately large — a cold
          # node loads CUDA and scans custom nodes before ComfyUI answers.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request, sys
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=5)
                  except Exception:
                      sys.exit(1)
            periodSeconds: 10
            failureThreshold: 90

          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request, sys
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=10)
                  except Exception:
                      sys.exit(1)
            periodSeconds: 60
            failureThreshold: 3

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
        - name: output
          persistentVolumeClaim:
            claimName: comfyui-output
        - name: scratch
          emptyDir: {}

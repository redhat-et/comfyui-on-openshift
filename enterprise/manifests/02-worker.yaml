---
# GPU workers. No Service, no Route, no ingress — on purpose.
#
# ComfyUI inside these pods binds 127.0.0.1. The agent process in the same
# container is the only thing that can reach it, and the agent's only interface
# is Redis. That is what makes the pool safe to scale between 0 and N: there is
# no connection state, no load balancer affinity, and nothing for a user to
# point a browser at.
#
# THE `#TIER ` LINES are N2's per-card-class variants (docs/10-roadmap.md),
# committed commented out behind that prefix — the same convention the warm
# floor uses in 03-autoscale.yaml — so that `oc apply -f` of this file bare
# still deploys exactly the one default pool it always did. For each
# NON-default tier in .env's GPU_TIERS, enterprise/setup.sh renders a copy of
# this Deployment with the prefix stripped, TIER_NAME_PLACEHOLDER substituted,
# `comfy-worker` renamed `comfy-worker-<tier>`, and the PDB below dropped
# (see BEGIN POOL PDB). The default tier IS this file as committed: its
# workers leave WORKER_TIER unset and poll the bare comfy:queue, which is the
# same worker an untiered pool runs — that identity is the migration path,
# docs/09-engineering-handoff.md §3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfy-worker
  labels:
    app: comfy-worker
spec:
  # This number is not authoritative — the ScaledObject in 03-autoscale.yaml
  # owns it from the moment KEDA reconciles. It is 0 here so that applying the
  # manifests before the autoscaler exists does not start an $0.80/hour node.
  replicas: 0

  # RollingUpdate with NO surge, which is the opposite of the usual default and
  # is the only setting a GPU pool can hold.
  #
  # It was Recreate. On an autoscaled pool that means an image update deletes
  # every worker, then waits for new ones — and a new one waits on a GPU node,
  # a ~10 GB image pull, CUDA init and a model load, which is the 8-17 minutes
  # this whole design is arranged around. Times the pool. Deploying a one-line
  # change to worker_agent.py emptied the pool for most of half an hour, and
  # the symptom is jobs queueing with no worker to take them.
  #
  # maxSurge MUST be 0. Surge means "start the replacement before stopping the
  # old one", and a replacement worker needs a whole GPU: with N workers on N
  # cards, a surge pod is Pending until the cluster autoscaler provisions
  # another node — so a rollout that was meant to replace pods instead buys an
  # extra $0.80/hour node per surge, waits ~10 minutes for it, and only then
  # starts. maxUnavailable 1 with maxSurge 0 replaces them one at a time, in
  # place, and the pool keeps serving from the rest.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: comfy-worker
      # Tier renders select on the tier label TOO, so two tier Deployments
      # can never adopt each other's ReplicaSets. `app` stays on every pod
      # either way: 06-network-policy.yaml selects workers by it, and a tier
      # pod outside the egress lockdown would be the invariant broken by a
      # rename.
      #TIER comfy/tier: "TIER_NAME_PLACEHOLDER"

  template:
    metadata:
      labels:
        app: comfy-worker
        #TIER comfy/tier: "TIER_NAME_PLACEHOLDER"
    spec:
      # This label MUST be one the machine pool declares, not one Node Feature
      # Discovery applies at runtime — and that distinction silently breaks
      # scale-from-zero if you get it wrong.
      #
      # When the GPU pool is at zero nodes, the cluster autoscaler has no real
      # node to inspect. It builds a template from the pool's declared labels
      # and asks "would the pending pod fit?". NFD labels like
      # feature.node.kubernetes.io/pci-10de.present only exist once a node is
      # already running, so they are absent from that template, the autoscaler
      # concludes the pod would not fit, and it never provisions anything. The
      # pod stays Pending forever with no error that points at the cause.
      #
      # nvidia.com/gpu.present comes from `rosa create machinepool --labels` in
      # scripts/02-cluster.sh, so it IS in the template. setup.sh substitutes
      # GPU_NODE_LABEL here if your cluster labels its GPU nodes differently.
      nodeSelector:
        GPU_NODE_LABEL_KEY: "GPU_NODE_LABEL_VALUE"
        # Tier renders ALSO select on comfy/tier=<tier>, and that label must
        # be POOL-DECLARED (rosa create machinepool --labels, which setup.sh
        # passes) for exactly the scale-from-zero reason above: at zero nodes
        # the autoscaler matches against the pool's declared labels, so a
        # tier label applied any other way leaves every tier pod Pending
        # forever with the pool it needs sitting at zero.
        #TIER comfy/tier: "TIER_NAME_PLACEHOLDER"

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # A generation in flight is real money already spent. The agent traps
      # SIGTERM, stops taking new work, and finishes the current job; this is
      # the window it gets to do that. Anything much shorter and scale-down
      # throws away work.
      #
      # Must exceed JOB_TIMEOUT below, plus margin: a job may legally run for
      # the full JOB_TIMEOUT, and a drain that is SIGKILLed at second 900 of a
      # 1500-second render threw the work away anyway. Change them together.
      terminationGracePeriodSeconds: 1980

      # No Kubernetes API client lives in this pod, so the projected
      # ServiceAccount token is nothing but a credential sitting in the
      # filesystem waiting to be read. Verified against the source rather than
      # assumed: neither enterprise/gateway/hub.py nor
      # enterprise/worker/worker_agent.py imports a Kubernetes client or opens
      # the API server at all — Redis is the only thing either one dials.
      #
      # It matters more here than anywhere else in the namespace: this pod runs
      # arbitrary custom-node Python on a GPU node, and a mounted token is a
      # credential that node's code can read and use against the cluster.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: comfy-worker:latest

          env:
            # The username is in the URL and the password is beside it, which
            # is the whole of the wiring for the least-privilege Redis user
            # defined in 00-redis.yaml: redis.from_url() reads the user out of
            # the URL and takes the password from the keyword argument, so
            # worker_agent.py needed no change at all. Do not put the password
            # in the URL — it would land in the pod spec in clear text.
            #
            # This pod must never hold the `password` key of comfy-redis. That
            # is the admin credential the gateway and KEDA use, and anything
            # running in this container can read the environment; scripts/lint.sh
            # fails a worker Deployment that names it.
            - name: REDIS_URL
              value: redis://comfy-worker@redis:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: worker_password
            - name: QUEUE_KEY
              value: comfy:queue
            # The worker's tier declaration (N2): picks which one list its
            # BLMOVE polls — QUEUE_KEY:<tier>. Absent (this file as
            # committed) polls the bare QUEUE_KEY above, which is both the
            # untiered pool and the DEFAULT tier of a tiered one; only tier
            # renders carry it, so the default pool's workers never need to
            # know which tier is the default.
            #TIER - name: WORKER_TIER
            #TIER   value: "TIER_NAME_PLACEHOLDER"
            - name: JOB_TIMEOUT
              value: "1800"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: HF_HOME
              value: /models/.cache/huggingface
            - name: TORCH_HOME
              value: /models/.cache/torch

            # The file worker_agent.py touches on every pass of its main loop,
            # and the file the liveness probe below stats. Named here rather
            # than left to the agent's default so that the two halves of one
            # health check are wired from one place — a probe pointed at a path
            # nothing writes fails every worker in the pool, sixty seconds
            # apart, forever.
            #
            # It lives on the scratch emptyDir, which is the only writable path
            # in the container that is not shared with another pod.
            - name: AGENT_LIVENESS_FILE
              value: /tmp/comfy-agent-alive

          # Requests equal limits on every resource, which is not a style
          # choice — it is the QoS class. Read the numbers first, then why
          # they are equal.
          #
          # THE NUMBERS. All host RAM; none of it is the 24 GB of VRAM on the
          # card, and conflating the two is how this block previously asked
          # for a 24Gi limit. The smallest GPU instance type this repo
          # supports — g6.xlarge (the .env.example default), g5.xlarge,
          # g4dn.xlarge, all of them in scripts/06-status.sh's price table —
          # is 4 vCPU and 16 GiB. Of that 16 GiB the scheduler offers roughly
          # 12.4 GiB: OpenShift's automatic node sizing reserves about 2.8 GiB
          # on a 16 GiB machine, plus a 100 MiB eviction threshold. A GPU node
          # then runs more DaemonSets than a plain one — ovn-kubernetes,
          # machine-config, node-exporter, the GPU operator's driver,
          # container toolkit, device plugin and DCGM exporter, and NFD —
          # holding on the order of 1.5-2 GiB and several hundred millicores.
          # That leaves ~10.5 GiB and ~3 cores for this pod, so 10Gi and 2
          # cores is the largest round figure that provably fits.
          #
          # It is also enough for the documented workload: a single SDXL-class
          # checkpoint is ~7 GB (docs/03-storage.md) and is staged in host RAM
          # on its way to VRAM, torch plus the CUDA host runtime and its pinned
          # staging buffers are another 1.5-2 GiB, and the agent is noise —
          # roughly 9 GiB at peak, with about a gigabyte spare. What 10Gi does
          # NOT cover is a workflow holding two large checkpoints in host RAM
          # at once (ComfyUI offloads to CPU RAM under VRAM pressure). The
          # answer to that is a larger instance type — g6.2xlarge or
          # g6e.xlarge, 32 GiB — because a limit above what the node can give
          # is not more memory, it is just a number that never binds.
          #
          # WHY EQUAL. Equal requests and limits on cpu AND memory is what
          # makes this pod Guaranteed QoS, and both halves of that matter to a
          # pod holding an $0.80/hour card mid-generation:
          #   - The kubelet evicts pods that are over their request before it
          #     touches a Guaranteed pod. The old 8Gi request with a 24Gi limit
          #     was Burstable and went over its request on the first checkpoint
          #     load, i.e. during every job.
          #   - oom_score_adj follows the same class. Burstable gets
          #     1000 - 1000 x request/capacity (~500 at 8Gi of 16 GiB);
          #     Guaranteed gets -997. That is the difference between the kernel
          #     picking ComfyUI and the kernel picking almost anything else.
          # The cost is no bursting. On a node with one GPU, and therefore one
          # GPU pod, the burst headroom was only ever borrowed from the kubelet
          # and those DaemonSets — the processes whose starvation is exactly
          # what turns a container problem into a node-level one.
          #
          # A reachable limit is also the point: at 10Gi the container hits its
          # own cgroup ceiling and dies as a clean OOMKilled you can read off
          # `oc describe`, instead of the node deciding for it. scripts/lint.sh
          # holds these numbers; it fails a GPU pod that is Burstable or that
          # asks for more than the smallest supported instance can give.
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi
            limits:
              # GPUs are indivisible: request and limit must be equal — as
              # they now are for cpu and memory too, for the reasons above.
              # This block is also what makes the pod Pending until a GPU node
              # exists, which is in turn what makes the cluster autoscaler
              # provision one. That still holds, and it is why the requests
              # must stay inside one node's allocatable: a request no node can
              # satisfy leaves the pod Pending forever with a node already
              # running, which looks identical and is not fixable by adding
              # nodes.
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 10Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Flush anything still buffered for the shared filesystem before the
          # container goes away. Cheap insurance: a pod that exits with dirty
          # NFS pages can leave the kubelet retrying the unmount, which is one
          # of the ways a volume ends up looking stuck. Runs before SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sync; sleep 2"]

          volumeMounts:
            - name: models
              mountPath: /models
            - name: output
              mountPath: /output
            - name: scratch
              mountPath: /tmp

          # No HTTP probes: ComfyUI listens on loopback, so the kubelet cannot
          # reach it. An exec probe runs inside the container's network
          # namespace and can. The startup budget is deliberately large — a cold
          # node loads CUDA and scans custom nodes before ComfyUI answers.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request, sys
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=5)
                  except Exception:
                      sys.exit(1)
            periodSeconds: 10
            failureThreshold: 90

          # TWO processes, ONE container, and therefore one liveness probe that
          # has to answer for both. start.sh runs ComfyUI and the agent side by
          # side; a container may only declare one livenessProbe, so the two
          # assertions are `sh -ec` and two lines rather than two probes.
          #
          # The first line is the original: can ComfyUI answer? It binds
          # loopback, so nothing outside the container can ask — an exec probe
          # runs in the container's network namespace and can.
          #
          # The second line is the half that was missing, and it is the one
          # that catches the expensive failure. The agent can be alive,
          # connected and completely wedged — parked in a BLMOVE against a
          # blackholed TCP connection, say — while ComfyUI answers /system_stats
          # perfectly. The pod stays Ready, holds a card at ~$0.80/hour, and
          # takes no work, indefinitely. worker_agent.py touches
          # AGENT_LIVENESS_FILE on every pass of its main loop; if that file is
          # more than two minutes old the agent has stopped going round.
          #
          # THE CONTRACT THIS DEPENDS ON: the touch must happen on every pass
          # INCLUDING while a job is running. Jobs legitimately run for
          # JOB_TIMEOUT — 1800 seconds — so an agent that touched the file only
          # between jobs would fail this probe in the middle of every long
          # generation and be killed for working. That is a property of
          # worker_agent.py, not of this file, and it is why the threshold is
          # written in seconds here rather than derived from JOB_TIMEOUT.
          #
          # `stat -c %Y` is GNU stat, which is what UBI9 has. `sh -ec` so the
          # first line failing is the probe failing, without an explicit exit.
          # No initialDelaySeconds: the startupProbe above already gates this
          # one, and it does not pass until ComfyUI has finished loading.
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=10)"
                  test $(( $(date +%s) - $(stat -c %Y "$AGENT_LIVENESS_FILE") )) -lt 120
            periodSeconds: 60
            failureThreshold: 3

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
        - name: output
          persistentVolumeClaim:
            claimName: comfyui-output
        - name: scratch
          emptyDir: {}
# BEGIN POOL PDB — setup.sh's tier renders delete from this marker to the end
# of the file: this PDB selects on `app: comfy-worker` alone, which every tier
# pod also carries, and Kubernetes REFUSES evictions for a pod matched by more
# than one PDB — so a copy of this budget per tier would not be per-tier
# protection, it would block every GPU node drain outright. One budget,
# selecting the whole pool across tiers, is the correct amount of PDB.
---
# Keep the pool from being drained all at once.
#
# maxUnavailable: 1 rather than minAvailable: N, because N is not a number this
# file knows — KEDA owns the replica count and it is legitimately 0 most of the
# time. A minAvailable of anything above 0 against a pool that is deliberately
# empty would block every node drain in the namespace forever; minAvailable: 0
# would be a no-op with a comment.
#
# On a tiered pool (N2) this one budget covers every tier's pods — see the
# marker above — so a cluster upgrade drains GPU nodes one at a time POOL-WIDE
# rather than one per tier. Slower upgrades on a many-tier pool; never a
# blocked eviction.
#
# What this actually buys, and it is worth being precise because a PDB on an
# autoscaled Deployment is easy to write and easy to overrate: a cluster
# upgrade draining several GPU nodes at once takes them one at a time instead
# of together, and a drain cannot land on a pool that is already down a worker.
# Each eviction still costs whatever job that worker was running — the pod's
# 1980-second grace period is what protects the job, not this.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: comfy-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: comfy-worker

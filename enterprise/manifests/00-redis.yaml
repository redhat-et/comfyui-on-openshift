---
# Redis: the queue, and the only thing the gateway and the workers share
# besides the model volume.
#
# Deliberately a single instance with a small persistent volume rather than a
# clustered deployment. At this scale the failure mode you actually care about
# is "the pod restarted and in-flight jobs vanished", which AOF persistence
# handles; the failure mode a Redis cluster protects against costs three nodes
# and buys you nothing until you have far more traffic than one GPU can serve.
#
# It is also namespace-internal only: no Route, no Service type LoadBalancer,
# and a NetworkPolicy that admits only the gateway, the workers and KEDA. That
# policy used to live at the bottom of this file; it now sits with the rest of
# the namespace's rules in 06-network-policy.yaml, which is the only place the
# whole picture — a default deny, and the four flows allowed to exist — can be
# read at once.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Redis speaks Redis. It has no reason to hold a token for the cluster's
      # API server, and this is a pod whose entire job is to sit in the middle
      # of the queue holding everybody's work.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          # The major version is pinned by the repository name (redis-7), so
          # :latest floats only across Red Hat's patch rebuilds of Redis 7 —
          # a deliberate trade for CVE fixes without manifest churn. If you
          # need bit-for-bit reproducibility, replace with a digest from
          # `oc image info registry.redhat.io/rhel9/redis-7:latest`.
          image: registry.redhat.io/rhel9/redis-7:latest

          ports:
            - name: redis
              containerPort: 6379

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: password
            # The second password: the worker's ACL user, below. A separate
            # key in the same Secret so rotating one does not rotate the other,
            # and so the worker Deployment can reference the one it is allowed
            # to have without ever naming the admin key.
            - name: REDIS_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfy-redis
                  key: worker_password

          # appendonly gives durability across a pod restart. maxmemory-policy
          # noeviction is the important one: the default would silently evict
          # queued jobs under memory pressure, which looks exactly like jobs
          # being dropped at random.
          #
          # --dir is not optional. Overriding args bypasses the image's
          # run-redis entrypoint and its /etc/redis/redis.conf, so redis-server
          # falls back to dir "." — which in this image is the inherited
          # WORKDIR /opt/app-root/src, i.e. ephemeral container storage. The AOF
          # would land there, the mounted PVC would stay empty, and every queued
          # job would be lost on restart: exactly the failure appendonly is here
          # to prevent, with none of the symptoms that would tell you.
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --dir
            - /var/lib/redis/data
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction

            # ---------------------------------------------------------------
            # The worker's Redis identity, and the reason it is not `default`.
            #
            # A worker pod runs whatever custom-node Python is baked into the
            # image, on a GPU node, and until this block existed that code
            # shared ONE password with the gateway and with KEDA. Anything
            # running in the pod could read it out of the environment and then
            # do anything Redis can do: FLUSHALL the queue, rewrite another
            # user's job state, read every submitter identity out of the
            # showback hashes, or simply CONFIG SET a smaller maxmemory and
            # watch the queue evaporate.
            #
            # So the worker gets its own user, allowed exactly the commands
            # worker_agent.py issues and exactly the keys it names — read out
            # of the source, not guessed:
            #
            #   PING                       health_check_interval and connect
            #   SET/DEL   comfy:worker:*   the heartbeat and its removal
            #   BLMOVE    comfy:queue -> comfy:processing:*   the only pop
            #   LREM      comfy:processing:*                  the ack
            #   GET/DEL   comfy:job:*      the payload beside the queue entry
            #   XADD      comfy:job:*      the progress stream
            #   EXPIRE    comfy:job:*      arming the stream and state TTLs
            #   HGET/HSET comfy:job:*      owner, phase, cancel, status
            #   EVALSHA + SCRIPT LOAD      SHOWBACK_ACCRUE_LUA, which redis-py
            #                              loads on first NOSCRIPT
            #
            # and the Lua's own calls, because Redis 7 runs a script with the
            # CALLING user's permissions and checks every redis.call inside it:
            # HGET, HDEL, HEXISTS, HLEN, HINCRBYFLOAT, HSET and EXPIRE against
            # the job's state hash and comfy:showback:<period>. Deleting a
            # command from this list does not fail the build; it fails one
            # Redis call at runtime, so the list is pinned by scripts/lint.sh.
            #
            # What it does NOT get: -@all first, so nothing outside the list
            # above is reachable — no FLUSHALL, no CONFIG, no SCAN, no KEYS, no
            # DEBUG, no reading a key outside the five patterns. resetchannels
            # because nothing here uses pub/sub at all.
            #
            # `default` deliberately stays broad. It is the gateway's user (the
            # gateway is trusted with the whole keyspace by construction — it
            # is the thing that writes it), KEDA's, and the readiness probe's;
            # narrowing it is a separate change with three consumers to prove,
            # and it is not the credential arbitrary node code can read.
            #
            # Each token is its own argument on purpose: redis-server quotes
            # every non-`--` argv element before parsing it, so "on >x ~y" as
            # one element arrives as one nonsense token, not three rules.
            # ---------------------------------------------------------------
            - --user
            - comfy-worker
            - "on"
            - ">$(REDIS_WORKER_PASSWORD)"
            - resetchannels
            - "~comfy:queue"
            - "~comfy:processing:*"
            - "~comfy:worker:*"
            - "~comfy:job:*"
            - "~comfy:showback:*"
            - -@all
            - +ping
            - +client|setinfo
            - +get
            - +set
            - +del
            - +blmove
            - +lrem
            - +xadd
            - +expire
            - +hget
            - +hset
            - +hdel
            - +hexists
            - +hlen
            - +hincrbyfloat
            - +evalsha
            - +script|load

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data

          readinessProbe:
            exec:
              # --no-auth-warning: without it every probe run logs redis-cli's
              # password-on-command-line warning, ten times a minute, forever.
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data

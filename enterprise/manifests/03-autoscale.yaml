---
# Scale-to-zero, the pod half.
#
# Two layers have to agree for this to save any money, and only one of them
# lives in Kubernetes:
#
#   POD layer (this file). KEDA watches the Redis queue and sets the worker
#   Deployment's replica count, including all the way to 0. On its own this
#   saves nothing — an idle GPU *node* bills the same whether a pod is on it or
#   not.
#
#   NODE layer (rosa machine pool autoscaling, applied by enterprise/setup.sh).
#   With min-replicas 0 on the GPU pool, the cluster autoscaler removes the node
#   once nothing is scheduled on it, and provisions one when a worker pod goes
#   Pending for want of a GPU. This is where the ~$0.98/hour actually goes away.
#
# The cost of that is cold start. Node provision plus a ~10 GB image pull plus
# CUDA init plus model load is realistically 8-17 minutes for the first job
# after an idle period. The gateway tells the user this rather than leaving them
# staring at a bar that has not moved. See docs/06-enterprise-architecture.md
# for when that trade is worth taking and when it is not.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: comfy-redis-auth
spec:
  secretTargetRef:
    - parameter: password
      name: comfy-redis
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: comfy-worker
spec:
  scaleTargetRef:
    name: comfy-worker

  minReplicaCount: 0
  maxReplicaCount: 3

  # How often KEDA checks the queue. 15s is responsive without hammering Redis.
  pollingInterval: 15

  # How long the queue must stay empty before scaling back to zero. Ten minutes
  # is chosen against the cold start above: shorter, and a user taking a break
  # between prompts pays the 10-minute penalty repeatedly; longer, and you are
  # paying for idle GPU. Tune this one number first if the economics feel wrong.
  cooldownPeriod: 600

  # No idleReplicaCount here. KEDA's admission webhook enforces
  # idleReplicaCount < minReplicaCount, so setting it to 0 alongside
  # minReplicaCount: 0 gets the whole ScaledObject rejected with
  # "IdleReplicaCount=0 must be less than MinReplicaCount=0". minReplicaCount: 0
  # already gives scale-to-zero; idleReplicaCount is for the different case of
  # "park at N while idle, scale to min..max when active".

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Do not thrash. One pod at a time, and only after the window above.
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300

  triggers:
    - type: redis
      metadata:
        # Fully qualified, and not the short name. The scaler dials from the
        # keda-operator pod in openshift-keda, not from a pod in this namespace,
        # so a bare "redis" resolves against openshift-keda's search domains and
        # fails with "no such host". setup.sh substitutes the real namespace.
        address: redis.NAMESPACE_PLACEHOLDER.svc.cluster.local:6379
        # Q1 (docs/10-roadmap.md) gave the queue fair-queueing across
        # submitters WITHOUT giving each submitter their own Redis list: a job
        # is inserted at a fairness-computed position within this ONE list
        # rather than always at the back, so comfy:queue stays the single
        # physical list it always was, popped by the same single BLMOVE in
        # worker_agent.py's main loop. This trigger is therefore unchanged —
        # `listName: comfy:queue` still names the entire, only, queue, and its
        # length still means "total jobs waiting", fair-queued or not.
        # Nothing here was a candidate for becoming N per-submitter triggers.
        #
        # Nor can this trigger see a length that dips. The insert splices the
        # new entry in with LINSERT against a pivot already on the list, so
        # comfy:queue is only ever added to, one entry at a time, and LLEN is
        # monotonic across a submit. An earlier version of that script rebuilt
        # the list (DEL, then batched RPUSH, under one EVAL) and this comment
        # used to hand cluster day the job of proving that no length-0 blip
        # escaped the EVAL and reached the scaler as "queue drained". That
        # question no longer exists to be answered: there is no DEL. See
        # hub.py's BEGIN FAIR QUEUEING for the other, worse thing the rewrite
        # cost.
        #
        # What cluster day still owes is the thing a laptop cannot show at
        # all: that the pool scales 0 -> 1 -> 0 against this trigger with
        # fair-queueing live. See docs/10-roadmap.md's cluster day section.
        listName: comfy:queue
        # Target queue depth per worker. With listLength 1, two queued jobs ask
        # for two workers — which is what you want when each job occupies a
        # whole GPU for its duration.
        listLength: "1"
        # Any queue at all activates the scaler from zero. The default (0) means
        # the same thing, but stating it makes the zero-to-one path explicit.
        activationListLength: "0"
        enableTLS: "false"
        databaseIndex: "0"
      authenticationRef:
        name: comfy-redis-auth

    # BEGIN WARM FLOOR
    # The scheduled warm floor — docs/10-roadmap.md's I1, and the setting the
    # README's 5-30 person sizing table assumed existed.
    #
    # KEDA evaluates every trigger and takes the MAXIMUM, so this coexists with
    # the queue trigger above rather than replacing it: inside the window the
    # pool never drops below desiredReplicas, outside it the queue is the only
    # thing that decides, and a busy afternoon still scales past the floor to
    # maxReplicaCount. Nothing here changes what happens at 19:00 — the queue
    # trigger's cooldownPeriod drains the pool as it always did.
    #
    # WHY THIS AND NOT A CRON JOB. The obvious implementation of "warm during
    # working hours" is something that edits the machine pool's min-replicas on
    # a schedule, and that is I3's mechanism and the reason I1 and I3 were
    # recorded as contradicting each other: any `./enterprise/setup.sh` re-run
    # puts min-replicas back and silently un-warms the pool, at a moment
    # nobody connects to the change they were actually deploying. Expressed as
    # a trigger, the floor is declarative and lives in .env — so re-running
    # setup.sh reasserts it instead of resetting it, which is the whole of the
    # I1/I3 conflict resolved by choosing where the state lives.
    #
    # Every value here is substituted by enterprise/setup.sh from .env, by KEY
    # rather than by matching the default beside it, for the same reason
    # maxReplicaCount is. The trigger is committed COMMENTED OUT, behind the
    # `#WARM ` prefix: KEDA's cron scaler wants a positive desiredReplicas, so
    # a file that anyone can `oc apply -f` directly must not carry a zero, and
    # a floor of nobody is better expressed by not having a floor. setup.sh
    # strips the prefix when WARM_WORKERS > 0 and substitutes the values;
    # when it is 0 this whole block is dropped.
    #
    # timezone: an IANA zone name, or UTC. It is the operator's working day
    # this is describing, so it is the one setting here that is usually wrong
    # on the default: a floor that warms at 09:00 UTC is a floor that warms at
    # 04:00 for a team in New York.
    #WARM - type: cron
    #WARM   metadata:
    #WARM     timezone: UTC
    #WARM     start: "0 9 * * 1-5"
    #WARM     end: "0 18 * * 1-5"
    #WARM     desiredReplicas: "1"
    # END WARM FLOOR
